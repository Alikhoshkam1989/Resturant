server:
  port: ${PORT:8080}
spring:
  web:
    locale: en
    locale-resolver: fixed
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/restaurant;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8081/realms/restaurant}
          jwk-set-uri: ${JWT_JWK_URI:http://localhost:8081/realms/restaurant/protocol/openid-connect/certs}
app:
  jwt-audience: restaurant-api
